openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Craftloop digital services agency API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: public
  - name: employee
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------- AUTH ----------
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in as admin or employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current logged-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- PUBLIC ----------
  /public/services:
    get:
      operationId: listPublicServices
      tags: [public]
      summary: List active services
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
  /public/services/{slug}/plans:
    get:
      operationId: listPublicServicePlans
      tags: [public]
      summary: List active plans for a service
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServicePlan"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /public/portfolio:
    get:
      operationId: listPublicPortfolioItems
      tags: [public]
      summary: List portfolio items, optionally filtered by service category
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ServiceCategory"
      responses:
        "200":
          description: Portfolio items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioItem"
  /public/testimonials:
    get:
      operationId: listPublicTestimonials
      tags: [public]
      summary: List published testimonials
      responses:
        "200":
          description: Testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
  /public/meeting-slots:
    get:
      operationId: listPublicMeetingSlots
      tags: [public]
      summary: List open consultation slots
      responses:
        "200":
          description: Open slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Slot"
  /public/interview-slots:
    get:
      operationId: listPublicInterviewSlots
      tags: [public]
      summary: List open interview slots for a given applicant to self-book
      parameters:
        - name: applicantId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Open interview slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Slot"
  /public/inquiries:
    post:
      operationId: createInquiry
      tags: [public]
      summary: Submit a client quote request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInquiryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientInquiry"
  /public/meeting-bookings:
    post:
      operationId: createMeetingBooking
      tags: [public]
      summary: Book a free consultation slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingBookingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingBooking"
  /public/applicants:
    post:
      operationId: createApplicant
      tags: [public]
      summary: Submit a freelancer application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
  /public/interview-bookings:
    post:
      operationId: createInterviewBooking
      tags: [public]
      summary: Applicant self-books an interview slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewBookingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewBooking"

  # ---------- EMPLOYEE ----------
  /employee/assignments:
    get:
      operationId: listEmployeeAssignments
      tags: [employee]
      summary: List the logged-in employee's project assignments
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeAssignment"
  /employee/assignments/{id}:
    patch:
      operationId: updateEmployeeAssignment
      tags: [employee]
      summary: Submit or update a deliverable for an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeAssignmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeAssignment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /employee/payout-settings:
    get:
      operationId: getEmployeePayoutSettings
      tags: [employee]
      summary: Get the logged-in employee's payout settings
      responses:
        "200":
          description: Payout settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutSettings"
    patch:
      operationId: updateEmployeePayoutSettings
      tags: [employee]
      summary: Update the logged-in employee's payout settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutSettings"
  /employee/payments:
    get:
      operationId: listEmployeePayments
      tags: [employee]
      summary: List payments owed to the logged-in employee
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
  /employee/password:
    patch:
      operationId: updateEmployeePassword
      tags: [employee]
      summary: Change the logged-in employee's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordUpdateInput"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- ADMIN ----------
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Admin dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /admin/applicants:
    get:
      operationId: listAdminApplicants
      tags: [admin]
      summary: List applicants
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: serviceCategory
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ServiceCategory"
      responses:
        "200":
          description: Applicants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Applicant"
  /admin/applicants/{id}:
    get:
      operationId: getAdminApplicant
      tags: [admin]
      summary: Get an applicant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Applicant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAdminApplicant
      tags: [admin]
      summary: Update an applicant's status or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminApplicantUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
  /admin/applicants/{id}/select:
    post:
      operationId: selectApplicant
      tags: [admin]
      summary: Select an applicant, creating their Employee + User account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Applicant hired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HireResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/applicants/{id}/reject:
    post:
      operationId: rejectApplicant
      tags: [admin]
      summary: Reject an applicant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Applicant rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
  /admin/interview-slots:
    get:
      operationId: listAdminInterviewSlots
      tags: [admin]
      summary: List interview slots
      responses:
        "200":
          description: Slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Slot"
    post:
      operationId: createAdminInterviewSlot
      tags: [admin]
      summary: Open an interview slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Slot"
  /admin/interview-slots/{id}:
    patch:
      operationId: updateAdminInterviewSlot
      tags: [admin]
      summary: Update an interview slot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Slot"
  /admin/meeting-slots:
    get:
      operationId: listAdminMeetingSlots
      tags: [admin]
      summary: List consultation slots
      responses:
        "200":
          description: Slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Slot"
    post:
      operationId: createAdminMeetingSlot
      tags: [admin]
      summary: Open a consultation slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Slot"
  /admin/meeting-slots/{id}:
    patch:
      operationId: updateAdminMeetingSlot
      tags: [admin]
      summary: Update a consultation slot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Slot"
  /admin/meeting-bookings:
    get:
      operationId: listAdminMeetingBookings
      tags: [admin]
      summary: List consultation bookings
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetingBooking"
  /admin/meeting-bookings/{id}:
    patch:
      operationId: updateAdminMeetingBooking
      tags: [admin]
      summary: Confirm, reschedule, or cancel a consultation booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingBookingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingBooking"
  /admin/employees:
    get:
      operationId: listAdminEmployees
      tags: [admin]
      summary: List employees
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createAdminEmployee
      tags: [admin]
      summary: Manually add an employee (bypassing the applicant flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HireResult"
  /admin/employees/{id}:
    patch:
      operationId: updateAdminEmployee
      tags: [admin]
      summary: Update an employee (e.g. active/inactive)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEmployeeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
  /admin/inquiries:
    get:
      operationId: listAdminInquiries
      tags: [admin]
      summary: List client inquiries
      responses:
        "200":
          description: Inquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientInquiry"
  /admin/inquiries/{id}:
    patch:
      operationId: updateAdminInquiry
      tags: [admin]
      summary: Update a client inquiry's status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientInquiry"
  /admin/inquiries/{id}/convert-to-project:
    post:
      operationId: convertInquiryToProject
      tags: [admin]
      summary: Convert a client inquiry into a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertInquiryInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /admin/projects:
    get:
      operationId: listAdminProjects
      tags: [admin]
      summary: List projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createAdminProject
      tags: [admin]
      summary: Create a project directly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /admin/projects/{id}:
    patch:
      operationId: updateAdminProject
      tags: [admin]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /admin/projects/{id}/assignments:
    post:
      operationId: createAdminProjectAssignment
      tags: [admin]
      summary: Assign an employee to a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeAssignment"
  /admin/payments:
    get:
      operationId: listAdminPayments
      tags: [admin]
      summary: List payments
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createAdminPayment
      tags: [admin]
      summary: Create a payment record for a project/employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /admin/payments/{id}:
    patch:
      operationId: updateAdminPayment
      tags: [admin]
      summary: Mark a payment as paid or update its details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /admin/services:
    get:
      operationId: listAdminServices
      tags: [admin]
      summary: List all services
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createAdminService
      tags: [admin]
      summary: Create a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /admin/services/{id}:
    patch:
      operationId: updateAdminService
      tags: [admin]
      summary: Update a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteAdminService
      tags: [admin]
      summary: Delete a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /admin/service-plans:
    get:
      operationId: listAdminServicePlans
      tags: [admin]
      summary: List plans for a service
      parameters:
        - name: serviceId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServicePlan"
    post:
      operationId: createAdminServicePlan
      tags: [admin]
      summary: Create a service plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePlanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePlan"
  /admin/service-plans/{id}:
    patch:
      operationId: updateAdminServicePlan
      tags: [admin]
      summary: Update a service plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePlanUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePlan"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminServicePlan
      tags: [admin]
      summary: Delete a service plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /admin/portfolio-items:
    get:
      operationId: listAdminPortfolioItems
      tags: [admin]
      summary: List all portfolio items
      responses:
        "200":
          description: Portfolio items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioItem"
    post:
      operationId: createAdminPortfolioItem
      tags: [admin]
      summary: Create a portfolio item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioItem"
  /admin/portfolio-items/{id}:
    patch:
      operationId: updateAdminPortfolioItem
      tags: [admin]
      summary: Update a portfolio item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioItem"
    delete:
      operationId: deleteAdminPortfolioItem
      tags: [admin]
      summary: Delete a portfolio item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /admin/testimonials:
    get:
      operationId: listAdminTestimonials
      tags: [admin]
      summary: List all testimonials
      responses:
        "200":
          description: Testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
    post:
      operationId: createAdminTestimonial
      tags: [admin]
      summary: Create a testimonial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"
  /admin/testimonials/{id}:
    patch:
      operationId: updateAdminTestimonial
      tags: [admin]
      summary: Update or publish a testimonial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonialUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"
    delete:
      operationId: deleteAdminTestimonial
      tags: [admin]
      summary: Delete a testimonial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      tags: [admin]
      summary: Searchable history of sensitive admin actions
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Role:
      type: string
      enum: [ADMIN, EMPLOYEE]

    ServiceCategory:
      type: string
      enum:
        - WEB_DEVELOPMENT
        - VIDEO_EDITING
        - PHOTOGRAPHY_VIDEOGRAPHY
        - GRAPHIC_DESIGN
        - CONTENT_WRITING
        - SEO_DIGITAL_MARKETING

    PayoutMethod:
      type: string
      enum: [BANK_TRANSFER, PHONEPE, PAYPAL]

    SlotPurpose:
      type: string
      enum: [INTERVIEW, CLIENT_MEETING]

    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, minLength: 1 }

    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id: { type: integer }
        email: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        employeeId:
          type: ["integer", "null"]

    Service:
      type: object
      required: [id, category, title, slug, description, isActive, sortOrder]
      properties:
        id: { type: integer }
        category:
          $ref: "#/components/schemas/ServiceCategory"
        title: { type: string }
        slug: { type: string }
        description: { type: string }
        icon:
          type: ["string", "null"]
        startingPrice:
          type: ["string", "null"]
        isActive: { type: boolean }
        sortOrder: { type: integer }
        plans:
          type: array
          items:
            $ref: "#/components/schemas/ServicePlan"
    ServiceInput:
      type: object
      required: [category, title, slug, description]
      properties:
        category:
          $ref: "#/components/schemas/ServiceCategory"
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        icon: { type: string }
        startingPrice: { type: string }
        isActive: { type: boolean }
        sortOrder: { type: integer }
    ServiceUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        icon: { type: string }
        startingPrice: { type: string }
        isActive: { type: boolean }
        sortOrder: { type: integer }

    PlanBadge:
      type: string
      enum: [NONE, HOT, NEW, POPULAR, BEST_VALUE]

    PricingType:
      type: string
      enum: [ONE_TIME, MONTHLY]

    ServicePlan:
      type: object
      required: [id, serviceId, name, description, pricingType, badge, isActive, sortOrder]
      properties:
        id: { type: integer }
        serviceId: { type: integer }
        name: { type: string }
        description: { type: string }
        pricingType:
          $ref: "#/components/schemas/PricingType"
        startingPrice:
          type: ["string", "null"]
        badge:
          $ref: "#/components/schemas/PlanBadge"
        isActive: { type: boolean }
        sortOrder: { type: integer }
    ServicePlanInput:
      type: object
      required: [serviceId, name, description]
      properties:
        serviceId: { type: integer }
        name: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        pricingType:
          $ref: "#/components/schemas/PricingType"
        startingPrice: { type: string }
        badge:
          $ref: "#/components/schemas/PlanBadge"
        isActive: { type: boolean }
        sortOrder: { type: integer }
    ServicePlanUpdate:
